version: '3.9'

services:
  mysql:
    image: mysql:8
    container_name: petcat_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "2003"
      MYSQL_DATABASE: "petcat_db"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/petcat.sql:/docker-entrypoint-initdb.d/petcat.sql

  backend:
    build: ./backend
    container_name: petcat_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    env_file:
      - ./backend/.env  # <--- Esto carga tu JWT_SECRET
    environment:
      DATABASE_URL: "mysql://root:2003@mysql:3306/petcat_db"

volumes:
  mysql_data:
  