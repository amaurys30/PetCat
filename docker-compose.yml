# Las variables se leen del archivo .env de la raíz (ver .env.example).
services:
  mysql:
    image: mysql:8
    container_name: petcat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el .env de la raiz}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petcat_db}
      TZ: America/Bogota
    # Solo accesible desde esta máquina, no desde la red local.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Solo se ejecutan con un volumen nuevo, en orden alfabético: esquema y luego seed.
      - ./database/petcat.sql:/docker-entrypoint-initdb.d/01_petcat.sql:ro
      - ./database/seeds/dev_seed.sql:/docker-entrypoint-initdb.d/02_dev_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    container_name: petcat_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      # Solo se usa en modo "mailpit", pero así arranca con el backend.
      mailpit:
        condition: service_started
    # El segundo archivo elige el correo (MAIL_MODO en el .env de la raíz): "mailpit" (por
    # defecto) reemplaza el SMTP de backend/.env por Mailpit; "smtp" usa el de backend/.env.
    env_file:
      - ./backend/.env
      - ./docker/correo/${MAIL_MODO:-mailpit}.env
    # Dentro de la red de Docker la base está en mysql:3306, no en localhost:3307.
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-petcat_db}
    # La imagen puede no traer curl: se usa fetch de Node.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + (process.env.PORT || 3000) + '/api/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # API para el panel web contra la base de demo (petcat_demo), en 127.0.0.1:3001.
  # Solo arranca con el perfil "panel": docker compose --profile panel up -d
  # La primera vez crea petcat_demo con el esquema y el seed; para recargarla:
  #   docker compose exec backend-demo node scripts/db-demo.js
  backend-demo:
    build: ./backend
    container_name: petcat_backend_demo
    profiles: [panel]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      # Solo se usa en modo "mailpit", pero así arranca con el backend.
      mailpit:
        condition: service_started
    # Correo: igual que backend, con su propio interruptor (MAIL_MODO_DEMO).
    env_file:
      - ./backend/.env
      - ./docker/correo/${MAIL_MODO_DEMO:-mailpit}.env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: petcat_demo
      # Límites mucho más altos solo en la demo: las pruebas de punta a punta del panel hacen
      # muchas solicitudes seguidas desde la misma IP. petcat_backend conserva los normales.
      RATE_LIMIT_MAX: "100000"
      AUTH_RATE_LIMIT_MAX: "10000"
    # Esquema y seed para crear o recargar petcat_demo desde el contenedor.
    volumes:
      - ./database:/database:ro
    command: sh -c "node scripts/db-demo.js --si-no-existe && node src/server.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + (process.env.PORT || 3000) + '/api/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Correo de desarrollo: recibe todo lo que envían los backends en modo "mailpit" y lo
  # muestra en http://127.0.0.1:8025 (nada sale a internet). El SMTP queda en 127.0.0.1:1025
  # para la API corrida en el host (npm run dev con SMTP_HOST=localhost y SMTP_PORT=1025).
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: petcat_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 2000
      TZ: America/Bogota

volumes:
  mysql_data:
