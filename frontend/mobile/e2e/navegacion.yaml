# Recorre las 5 pestañas. Se corre en local, no en CI: npm run e2e
# Con Expo Go (M0): arrancar `npm start` y pasar la URL de Expo que muestra la terminal:
#   maestro test -e EXPO_URL=exp://192.168.1.50:8081 e2e/navegacion.yaml
# Con la development build (desde M4) el appId es co.petcat.app y sobra el openLink.
appId: host.exp.exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
- launchApp
- openLink: ${EXPO_URL}
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 60000
- tapOn: "Explorar"
- assertVisible: "Explorar"
- tapOn: "Carnet de mis mascotas"
- assertVisible: "Carnet"
- tapOn: "Citas"
- assertVisible: "Citas"
- tapOn: "Perfil"
- assertVisible: "Todavía no has iniciado sesión"
- tapOn: "Inicio"
- assertVisible: "Inicio"
