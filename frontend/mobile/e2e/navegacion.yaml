# Recorre las 5 pestañas y cierra sesión. Local, no en CI: npm run e2e
# Desde M1 la app abre en la Bienvenida sin sesión: primero entra con login.yaml.
#   maestro test -e EXPO_URL=exp://192.168.1.50:8081 e2e/navegacion.yaml
# Con la development build (desde M4) el appId es co.petcat.app y sobra el openLink.
appId: host.exp.exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
- runFlow: login.yaml
- tapOn: "Explorar"
- assertVisible: "Explorar"
- tapOn: "Carnet de mis mascotas"
- assertVisible: "Carnet"
- tapOn: "Citas"
- assertVisible: "Citas"
- tapOn: "Perfil"
- assertVisible: "cliente@petcat.test"
- tapOn: "Inicio"
- assertVisible: "Inicio"
- tapOn: "Perfil"
- tapOn: "Cerrar sesión"
- extendedWaitUntil:
    visible: "Ya tengo cuenta"
    timeout: 15000
