# Modo desarrollo de las APIs en Docker: el código de backend/ se monta en el contenedor
# y nodemon reinicia la API al guardar, sin reconstruir la imagen.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile panel up -d --build
#
# (o COMPOSE_FILE y COMPOSE_PROFILES en el .env de la raíz; ver .env.example y backend/README.md).
#
# - node_modules no se monta: queda el del contenedor (Linux), porque el de Windows no sirve
#   ahí (sharp y otros módulos nativos). Si cambia package.json: --build -V.
# - --legacy-watch: los cambios en archivos de Windows no llegan al contenedor como eventos;
#   nodemon revisa los archivos cada segundo (--polling-interval 1000; el valor por defecto,
#   100 ms, mantenía ocupados la CPU y el disco con dos APIs encendidas).
services:
  backend:
    build:
      context: ./backend
      target: dev
    command: npx nodemon --legacy-watch --polling-interval 1000 --watch src src/server.js
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./database:/database:ro

  backend-demo:
    build:
      context: ./backend
      target: dev
    command: sh -c "node scripts/db-demo.js --si-no-existe && npx nodemon --legacy-watch --polling-interval 1000 --watch src src/server.js"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./database:/database:ro
